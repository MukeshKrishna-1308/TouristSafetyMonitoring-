spring.application.name=campus-lost-and-found
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lost_found}
spring.datasource.username=${DATABASE_USERNAME:lost_found}
spring.datasource.password=${DATABASE_PASSWORD:lost_found}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:bXktZGV2LW9ubHktc2VjcmV0LWZvci1sb3N0LWZvdW5kLWFwaS0zMi1ieXRlcw==}
app.bootstrap.admin-email=${CAMPUS_ADMIN_EMAIL:}
app.bootstrap.admin-password=${CAMPUS_ADMIN_PASSWORD:}
app.auth.admin-registration-key=${ADMIN_REGISTRATION_KEY:}